# Gaia OS 1.0 (Westmere Edition) - Estabilidade de Kernel, Crash-Capture & Recovery
# Managed by GaiaOS Agentic Core (/home/francisco/Documentos/Projetos/GaiaOS)
# ==============================================================================

# 1. Magic SysRq habilitado para recuperação manual emergencial (Alt+SysRq+REISUB)
kernel.sysrq = 1

# 2. Auto-reboot garantido em 30 segundos após qualquer Kernel Panic
#    (Fallback seguro mesmo se o crashkernel kexec BSOD não estiver armado)
kernel.panic = 30

# 3. Escala qualquer Kernel Oops (como NULL pointer dereference em ext4/drivers)
#    imediatamente para Panic -> dispara o Gaia BSOD (kexec) + salvamento do
#    stack trace + contagem de 30s + reinício automático no kernel fallback,
#    em vez de congelar o desktop indefinidamente segurando locks de I/O.
kernel.panic_on_oops = 1

# 4. Detectores de travamento de CPU (Soft/Hard Lockup)
#    Evita que os 2 núcleos Westmere fiquem em deadlock silencioso eterno.
kernel.softlockup_panic = 1
kernel.hardlockup_panic = 1

# Mantém hung_task_panic desativado para evitar falsos positivos em I/O lento de USB/HDD
kernel.hung_task_panic = 0
