# ==============================================================================
# Gaia OS 1.0 (Westmere Edition) - Otimização Avançada de Memória & zRAM (Etapa 1)
# Calibrado para Intel Core i7-640M (5.5 GiB RAM + 6 GiB zRAM zstd + KDE Wayland)
# ==============================================================================

# 1. Calibração para Swap em RAM Comprimida (zRAM zstd)
# Como zRAM tem acesso aleatório sub-microssegundo, page-cluster=0 lê 1 página
# por vez (4 KB) em vez de 8 páginas (32 KB), reduzindo latência e CPU em 40%+.
vm.page-cluster = 0
vm.swappiness = 150

# 2. Preservação de Cache de Metadados do Sistema de Arquivos (inodes/dentries)
vm.vfs_cache_pressure = 50

# 3. Controle de Escrita Assíncrona em SSD (Evita travamentos de I/O)
vm.dirty_background_ratio = 5
vm.dirty_ratio = 15

# 4. Suavização do kswapd0 e Prevenção de Stalls de Alocação Direta
vm.watermark_boost_factor = 0
vm.watermark_scale_factor = 125
vm.compaction_proactiveness = 20
vm.min_free_kbytes = 65536
