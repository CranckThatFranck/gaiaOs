# ==============================================================================
# Gaia OS 1.0 - Ativação Persistente do MGLRU (Multi-Gen LRU) no Kernel 6.1
# ==============================================================================
# Habilita todas as 3 capacidades do MGLRU (0x0007 = 7: pagecache + anon + shmem)
# e protege o working set ativo da interface gráfica por 1000ms contra thrashing.
w /sys/kernel/mm/lru_gen/enabled - - - - 7
w /sys/kernel/mm/lru_gen/min_ttl_ms - - - - 1000
