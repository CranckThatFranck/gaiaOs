; ==============================================================================
; Gaia OS 1.0 - Blindagem Preventiva PHP contra "PHP2Shell"
; Mitiga CVE-2026-109618 (OOM longjmp RCE), CVE-2026-109619 (Stale Global State)
; e CVE-2026-115560 (Session Upload Progress RCE)
; ==============================================================================
[PHP]
; Desativa upload_progress de sessão (vetor direto do CVE-2026-115560 e PHP2Shell)
session.upload_progress.enabled = 0
session.upload_progress.cleanup = 1
session.use_strict_mode = 1
session.cookie_httponly = 1

; Restringe limites de memória e variáveis por requisição para evitar estados OOM parciais
max_input_vars = 1000
max_input_nesting_level = 32
enable_dl = Off
expose_php = Off
allow_url_include = Off
zend.assertions = -1
